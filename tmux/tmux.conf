# ==============================================================================
# tmux Recommended Configuration (2026 Edition)
# ==============================================================================

# ------------------------------------------------------------------------------
# Basic Settings
# ------------------------------------------------------------------------------

# Change prefix to C-a (more ergonomic)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Increase history limit
set -g history-limit 50000

# Fix escape-time for Neovim/AI agents
set -sg escape-time 0

# Enable mouse support
set -g mouse on

# Start window/pane indices at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ------------------------------------------------------------------------------
# Navigation & Layout
# ------------------------------------------------------------------------------

# Split panes using | and - (and preserve current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ------------------------------------------------------------------------------
# Status Bar & UI
# ------------------------------------------------------------------------------

# Basic styling
set -g status-style bg=default,fg=white
set -g status-left-length 40
set -g status-justify centre

# Monitor activity
setw -g monitor-activity on
set -g visual-activity on

# ------------------------------------------------------------------------------
# Plugins (via TPM)
# ------------------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'Determinant/tmux-colortag'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
#set -g @plugin 'SeemSeam/claude_codex_bridge'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Plugin settings
set -g @continuum-restore 'on'  # Auto-restore last saved session
set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato or mocha

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'select-pane -D' # Use Alt+j for moving down, keeping Ctrl+j as LF/newline
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Restore C-\ mapping for previous pane
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Status bar configuration with new plugins
set -g status-interval 2
set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"
set -g status-right "#{prefix_highlight} | CPU: #{cpu_percentage} | Mem: #{ram_percentage} | #($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load --interval 2) | #[fg=cyan]%Y-%m-%d %H:%M"
set -g status-right-length 120

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
